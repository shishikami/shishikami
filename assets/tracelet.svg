<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="252" viewBox="0 0 1200 252" role="img" aria-labelledby="title">
<title id="title">Tracelet — Privacy-first browser analytics SDK with typed events, durable queues and replaceable transports. TypeScript / IndexedDB / npm.</title>
