  <rect width="356" height="132" rx="12" fill="#0a1423" stroke="#294057"/>
  <text x="20" y="31" fill="#7995b1" font-size="13">FORMATTING, BUT MAKE IT CHAOTIC</text>
  <text x="20" y="61" fill="#8bb4dc" font-size="15">const answer = 42;</text>
  <path d="M24 76v14m-4-4 4 4 4-4" fill="none" stroke="#536e89" stroke-width="1.5"/>
  <text x="43" y="113" fill="#b8c8ff" font-size="15">const aNsWeR = 0x2a;</text>
</g>
