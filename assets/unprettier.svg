<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}@media(prefers-reduced-motion:reduce){.motion{animation:none!important}}</style>
