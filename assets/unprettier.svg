<text x="36" y="40" fill="#93b6ff" font-size="14" letter-spacing="2" class="mono">02 / DEVELOPER TOOL, WITH A TWIST</text>
<text x="36" y="94" fill="#f0f6fc" font-size="40" font-weight="650" letter-spacing="-1">Unprettier</text>
<text x="36" y="134" fill="#b3c6dc" font-size="21">Good code. Gloriously terrible formatting.</text>
<text x="36" y="168" fill="#819bb6" font-size="18">An AST-powered formatter for a little JavaScript chaos.</text>
